services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-PromptManagerDb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password123!}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Automatyczne pobranie modelu Mistral przy starcie kontenera
    entrypoint: >
      /bin/sh -c "ollama serve & sleep 5 && ollama pull mistral && wait"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__PostgresConnection=Host=db;Database=${POSTGRES_DB:-PromptManagerDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres_password123!}
      - AI__Provider=Ollama
      - AI__Ollama__BaseUrl=http://ollama:11434
      - AI__Ollama__Model=mistral
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5000
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - INTERNAL_API_URL=http://backend:8080
    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_data:
